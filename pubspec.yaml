name: tracker
description: A health tracking Flutter application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Step tracking
  pedometer: ^4.0.1
  
  # Permissions
  permission_handler: ^11.0.1
  
  # Local storage
  shared_preferences: ^2.2.2
  
  # State management
  provider: ^6.1.1
  
  # Charts
  fl_chart: ^0.66.0
  
  # Fonts
  google_fonts: ^6.1.0
  
  # Date formatting
  intl: ^0.18.1
  
  # Image picker
  image_picker: ^1.0.7
  
  # UI
  cupertino_icons: ^1.0.6
  
  # HTTP
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
